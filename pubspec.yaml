name: asu_schedule
description: "Расписание АГУ."

publish_to: 'none'


version: 1.0.1+2

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  intl: any

  dio: ^5.11.1
  dynamic_color: ^2.1.0
  material_ui: ^1.11.0
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  min_sdk_android: 29

  image_path: "assets/icon/icon.png"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  adaptive_icon_background: "#2563EB"

  windows:
    generate: true
    icon_size: 48

flutter:
  generate: true
  uses-material-design: true
